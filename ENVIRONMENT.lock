failure) for every one of the following, tested this session:
`docs.gdc.cancer.gov`, `portal.gdc.cancer.gov`, `www.ncbi.nlm.nih.gov`,
`ftp.ncbi.nlm.nih.gov`, `bioconductor.org`, `bioarchive.galaxyproject.org`,
`depot.galaxyproject.org`, `bioconductorhubs.blob.core.windows.net`,
`annotationhub.bioconductor.org`, `experimenthub.bioconductor.org`,
`cran.r-project.org`, `quay.io`, `zenodo.org`, `hgdownload.soe.ucsc.edu`.
Reachable and used in this session: `conda.anaconda.org` (bioconda,
conda-forge), `repo.anaconda.com`, `archive.ubuntu.com` /
`security.ubuntu.com` (https only -- the proxy does not tunnel plain HTTP,
so `docker/Dockerfile` rewrites apt's sources to https), `pypi.org` /
`files.pythonhosted.org` (bypass allowlist), `raw.githubusercontent.com`,
`api.github.com`, `mcr.microsoft.com`, and this session's own git-clone
proxy lane for public GitHub repos (`github.com/parklab/sigma`,
`github.com/Bioconductor/GenomeInfoDbData` -- see §2).

Reference-database version numbers below (§3) were therefore retrieved via
live `WebSearch` (dated 2026-09-07, same session) rather than direct fetch,
