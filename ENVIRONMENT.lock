### 2c. bioconductor-genomeinfodbdata -- locally rebuilt (successfully unblocked)

`bioconductor-genomeinfodbdata` hit the identical blocked-mirror pattern as
BSgenome.Hsapiens.UCSC.hg19 above (its own post-link.sh mirrors are the same
three hosts) and is a transitive dependency of `bioconductor-genomeinfodb`,
which is required by GenomicRanges/VariantAnnotation/BSgenome and would
otherwise have blocked essentially the whole R environment, not just PureCN
and SigMA. Unlike BSgenome.Hsapiens.UCSC.hg19, this package's GitHub mirror
(`github.com/Bioconductor/GenomeInfoDbData`) *was* reachable in time (before
the session's repo-attachment allowance was spent) and its data is tiny
(19 files, no git-lfs), so it was rebuilt locally and verified functional.
Full provenance and exact reproduction steps: `docker/local_channel/README.md`.
Summary:

- Source commit: `b5339e03cc0c9c188e773a7ec2b80a146601595a`
- True upstream version: `1.2.15` (bioconda's recipe wants `1.2.9`; every
  observed bioconda `GenomeInfoDb`-family constraint on this package is
  `>=1.2.0,<1.3.0`, satisfied by 1.2.15)
- License: Artistic-2.0 (permits this repackaging; contrast with SigMA's
  own license, which is why SigMA's source is not similarly vendored --
  see the top-level `.gitignore`)
- Wired into `docker/Dockerfile` as `-c /opt/local_channel`, the
  highest-priority conda channel

